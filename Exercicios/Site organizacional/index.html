<body>
    <div class="sidebar">

        </div>

    <div class="main-content">
        <div class="header">
            <h2 id="tituloPagina">Visão Geral</h2>

        </div>

        <div class="cards-grid">
            <div class="card">

            <div class="card">

                <p>Lembretes Pendentes</p>

                    <input type="text" id="descricao" placeholder="Ex: Parcelamento">
                </div>
                <div class="form-group">
                    <label for="valor">Valor Total (R$):</label>
                    <input type="number" id="valor" step="0.01" placeholder="0,00">
                </div>
                <div class="form-group" id="grupoParcelas">
                    <label for="parcelas">Quantidade de Parcelas:</label>
                    <input type="number" id="parcelas" min="1" value="1">
                </div>

                    <label for="dataVencimento">Data de Vencimento/Meta:</label>
                    <input type="date" id="dataVencimento">
                </div>

    <script>
        const inputCategoria = document.getElementById('categoria');
        const inputDescricao = document.getElementById('descricao');
        const inputValor = document.getElementById('valor');
        const inputParcelas = document.getElementById('parcelas');
        const inputData = document.getElementById('dataVencimento');
        const inputTipo = document.getElementById('tipo');
        const btnAdicionar = document.getElementById('btnAdicionar');

        const cardSaldo = document.getElementById('cardSaldo');
        const cardReceitas = document.getElementById('cardReceitas');
        const cardDespesas = document.getElementById('cardDespesas');
        const cardLembretes = document.getElementById('cardLembretes');

        const containerLembrete = document.getElementById('containerLembrete');
        const textoVazio = document.getElementById('textoVazio');

        const menuItems = document.querySelectorAll('.menu-item');
        const tituloPagina = document.getElementById('tituloPagina');

        let totalReceitas = 0;
        let totalDespesas = 0;
        let quantidadeContas = 0;

        menuItems.forEach((item) => {
            item.addEventListener('click', () =>{

                menuItems.forEach(i => i.classList.remove('active'));

                item.classList.add('active');

                tituloPagina.innerText = item.innerText;
            });
        });

        btnAdicionar.addEventListener('click', () =>{
            const categoriaTexto = inputCategoria.options[inputCategoria.selectedIndex].text;
            const descricao = inputDescricao.value;
            const valor = parseFloat(inputValor.value);
            const parcelas = parseInt(inputParcelas.value) || 1;
            const data = inputData.value;
            const tipo = inputTipo.value;

            if (descricao.trim() === '' || isNaN(valor) || valor <= 0 || !data){
                alert('Por favor, preencha a descrição, valor e a data!');
                return;
            }
            if(textoVazio){
                textoVazio.style.display = 'none';
            }
            if(tipo === 'receita'){
                totlaReceitas += valor;
            } else {
                totalDespesas += valor;
            }
            quantidadeContas++;

            cardReceitas.innerText = `R$ ${totalReceitas.toFixed(2)}`;
            cardDespesas.innerText = `R$ ${totalDespesas.toFixed(2)}`;
            cardSaldo.innerText = `R$ ${(totalReceitas - totalDespesas).toFixed(2)}`;
            cardLembretes.innerText = `${quantidadeContas} contas`;

            const dataFormatada = data.split('-').reverse().join('/');
            const novoItem = document.createElement('div');
            novoItem.classList.add('item-lembrete');
            if (tipo === 'receita') novoItem.classList.add('receita');

            const valorParceladoText = parcelas > 1 ? `(${parcelas}x de R$ ${(valor / parcelas).toFixed(2)})` : '';

            novoItem.innerHTML =`
            <div class="info-lembrete">
                <h4>${descricao}</h4>
                <span>${categoriaTexto}</span>
                <small style="display: block; margin-top: 6px; color: #444;">
                  📅 Vence: <strong>${dataFormatada}</strong> ${valorParceladoText}
                    </small>
            </div>
            <div class="valor-lembrete" style="color: ${tipo === 'receita' ? '#1b5e20' : '#b71c1c'}">
                ${tipo === 'receita' ? '+' : '-'} R$ ${valor.toFixed(2)}
                </div>
             `;
            containerLembrete.appendChild(novoItem);
            
            inputDescricao.value = '';
            inputValor.value = '';
            inputParcelas.value = '1';
            inputData.value = '';
        });
    </script>
